group = "com.it7.flutter_audio_recorder_player"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "1.8.22"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.it7.flutter_audio_recorder_player"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        implementation("org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version")
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version")
        // Media3 dependencies (ExoPlayer 2.0)
        implementation("androidx.media3:media3-exoplayer:1.3.0")
        implementation("androidx.media3:media3-exoplayer-dash:1.3.0")
        implementation("androidx.media3:media3-exoplayer-hls:1.3.0")
        implementation("androidx.media3:media3-exoplayer-rtsp:1.3.0")
        implementation("androidx.media3:media3-database:1.3.0")  // For caching
        implementation("androidx.media3:media3-session:1.3.0")  // For MediaSession integration
        implementation("androidx.media3:media3-common:1.3.0")
        implementation("androidx.media3:media3-ui:1.3.0")  // For UI components
        implementation("androidx.media:media:1.6.0")
        implementation("androidx.lifecycle:lifecycle-runtime:2.6.2")
        implementation("androidx.core:core:1.12.0")
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
